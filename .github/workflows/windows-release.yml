name: Windows release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies and set release version
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          node scripts/set-build-version.cjs $env:GITHUB_RUN_NUMBER
      - name: Build and test
        run: |
          pnpm build
          pnpm test
      - name: Package Windows installer
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([bool]$env:WIN_CSC_LINK -ne [bool]$env:WIN_CSC_KEY_PASSWORD) { throw 'Both code signing secrets are required.' }
          pnpm desktop:dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Get-ChildItem release/Sketchspace-Setup-*.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($env:WIN_CSC_LINK -and $signature.Status -ne 'Valid') { throw "Expected a valid installer signature; got $($signature.Status)." }
          if (-not $env:WIN_CSC_LINK) { Write-Host '::warning::Installer is unsigned and may trigger SmartScreen. Configure code signing secrets to sign future releases.' }
      - name: Checksum and publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem release/Sketchspace-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer missing' }
          $hash = (Get-FileHash -Algorithm SHA512 $installer.FullName).Hash.ToLowerInvariant()
          "$hash *$($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha512"
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release create $tag $installer.FullName "$($installer.FullName).sha512" release/latest.yml --target $env:GITHUB_SHA --title "Sketchspace $tag" --generate-notes
